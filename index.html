<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abraham Berne Cours gratuit guitare basse </title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Poppins',sans-serif;
background:
radial-gradient(circle at top,#1d4ed8 0%,#111827 45%,#020617 100%);
min-height:100vh;
display:flex;
flex-direction:column;
color:#fff;
overflow:hidden;

}

.bg{

position:fixed;
width:700px;
height:700px;
border-radius:50%;
background:rgba(59,130,246,.18);
filter:blur(120px);
top:-250px;
left:-180px;
z-index:0;

}

.bg2{

position:fixed;
width:650px;
height:650px;
border-radius:50%;
background:rgba(37,99,235,.12);
filter:blur(120px);
bottom:-250px;
right:-180px;
z-index:0;

}

main{

flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:40px;
position:relative;
z-index:1;

}

.card{

background:rgba(255,255,255,.06);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.12);
padding:70px 50px;
border-radius:30px;
text-align:center;
max-width:700px;
width:100%;
box-shadow:
0 20px 60px rgba(0,0,0,.35);

}

h1{

font-size:48px;
font-weight:800;
margin-bottom:18px;

}

p{

font-size:18px;
line-height:1.7;
color:#d6d6d6;
margin-bottom:45px;

}

.btn{

display:inline-flex;
align-items:center;
justify-content:center;
padding:20px 60px;
font-size:20px;
font-weight:700;
text-decoration:none;
color:#fff;
background:linear-gradient(135deg,#2563eb,#3b82f6);
border-radius:70px;
transition:.35s;
box-shadow:0 15px 35px rgba(37,99,235,.45);

}

.btn:hover{

transform:translateY(-6px) scale(1.03);
box-shadow:0 20px 45px rgba(37,99,235,.65);

}

footer{

position:relative;
z-index:1;
padding:25px;
text-align:center;
border-top:1px solid rgba(255,255,255,.08);

}

footer a{

color:#cbd5e1;
text-decoration:none;
margin:0 14px;
font-size:15px;
transition:.3s;

}

footer a:hover{

color:#fff;

}

@media(max-width:768px){

h1{

font-size:34px;

}

.card{

padding:45px 28px;

}

.btn{

width:100%;
padding:18px;
font-size:18px;

}

footer{

display:flex;
flex-direction:column;
gap:12px;

}

footer a{

margin:0;

}

}

</style>

</head>

<body>

<div class="bg"></div>
<div class="bg2"></div>

<main>

<div class="card">

<h1>Cours gratuit </h1>

<p>
télécharge ton cadeau gratuit ici 
</p>

<a class="btn"
href="https://abrahamberne.gumroad.com/l/tyvju"
target="_blank">
Clique ici  →
</a>

</div>

</main>

<footer>

<a href="https://abrahamberne1.github.io/ultrabasse/music/mentionlegale">Mentions légales</a>

|

<a href="https://abrahamberne1.github.io/ultrabasse/music/mentionlegale">Politique de confidentialité</a>

|

<a href="https://abrahamberne1.github.io/ultrabasse/music/mentionlegale">Contact</a>

</footer>

</body>
</html>
